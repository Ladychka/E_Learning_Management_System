name: elms_mobile
description: ELMS Flutter mobile app
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.4.0
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5
  go_router: ^13.0.1
  shared_preferences: ^2.2.2
  cached_network_image: ^3.3.1
  intl: ^0.19.0
  cupertino_icons: ^1.0.6
  video_player: ^2.8.2
  chewie: ^1.7.1
  flutter_pdfview: ^1.3.2
  file_picker: ^8.1.0
  url_launcher: ^6.2.4
  webview_flutter: ^4.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/