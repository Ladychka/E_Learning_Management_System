version: "3.9"
services:
  db:
    image: postgres:15-alpine
    container_name: elms-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: elms
      POSTGRES_PASSWORD: elms_secret
      POSTGRES_DB: elms_db
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U elms -d elms_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: